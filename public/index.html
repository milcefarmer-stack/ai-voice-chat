<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 语音对话（本地运行）</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🎙️ AI 语音对话</h1>
    <p>VAD 自动端点检测 · 流式回答 · 可随时打断 · 自然语音合成 —— 全部本地运行</p>
  </header>

  <!-- 配置状态提示 -->
  <div id="config-bar" class="card config-bar" hidden></div>

  <!-- 聆听状态 -->
  <div id="listen-indicator" class="card listen-indicator" hidden>
    <span class="dot"></span>
    <span id="listen-text">正在聆听…</span>
  </div>

  <!-- 对话记录 -->
  <div id="chat-log" class="card chat-log"></div>

  <!-- 历史对话列表 -->
  <div id="history-panel" class="card history-panel" hidden></div>

  <!-- 控制区 -->
  <div class="card controls">
    <div class="row">
      <button id="listen-btn" class="primary big">⏸ 暂停聆听</button>
      <button id="history-btn">📚 历史</button>
      <button id="clear-btn">清空对话</button>
    </div>

    <div class="row">
      <label for="lang-select">识别语言</label>
      <select id="lang-select">
        <option value="zh-CN" selected>中文</option>
        <option value="en-US">English</option>
        <option value="ja-JP">日本語</option>
      </select>

      <label for="speed-select">语速</label>
      <select id="speed-select">
        <option value="0.6">0.6 慢</option>
        <option value="0.8">0.8</option>
        <option value="0.9">0.9</option>
        <option value="1.0" selected>1.0 正常</option>
        <option value="1.1">1.1</option>
        <option value="1.2">1.2</option>
        <option value="1.5">1.5 快</option>
      </select>

      <span class="hint">自动聆听开启时直接说话即可，AI 回答中说话可打断</span>
    </div>

    <div class="row">
      <input id="text-input" type="text" placeholder="也可以直接打字提问（按回车发送）" />
      <button id="send-btn">发送</button>
    </div>

    <div id="status" class="status">正在加载…</div>
  </div>

  <footer>
    <p id="stt-warning" hidden>⚠️ VAD 初始化失败：请检查浏览器麦克风权限，或改用文字输入。</p>
    <p>语音识别：本地 sherpa-onnx（SenseVoice，离线）· 语音合成：本地 sherpa-onnx（vits-melo，离线）· VAD：Silero（浏览器本地运行）</p>
  </footer>

  <script src="/vendor/ort/ort.min.js"></script>
  <script src="/vendor/vad/vad.bundle.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
